<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g stroke="#836EF9" stroke-width="2" fill="none" filter="url(#glow)">
    <!-- Outer Hexagon -->
    <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" />
    
    <!-- Inner lines to form an isometric 3D cube -->
    <line x1="50" y1="50" x2="50" y2="90" />
    <line x1="50" y1="50" x2="15" y2="30" />
    <line x1="50" y1="50" x2="85" y2="30" />

    <!-- A smaller floating diamond inside the top face for elegance -->
    <polygon points="50,20 65,30 50,40 35,30" stroke-width="1.5" />
  </g>
</svg>
