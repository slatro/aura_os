<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="none" stroke="#836EF9" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Inner lines creating 3D icosahedron effect -->
  <!-- Top point to middle vertices -->
  <line x1="50" y1="5" x2="30" y2="40" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="50" y1="5" x2="70" y2="40" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Bottom point to middle vertices -->
  <line x1="50" y1="95" x2="30" y2="60" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="50" y1="95" x2="70" y2="60" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Middle hexagon/diamond -->
  <line x1="30" y1="40" x2="70" y2="40" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="30" y1="60" x2="70" y2="60" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="30" y1="40" x2="10" y2="25" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="30" y1="60" x2="10" y2="75" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="70" y1="40" x2="90" y2="25" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="70" y1="60" x2="90" y2="75" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Vertical lines -->
  <line x1="30" y1="40" x2="30" y2="60" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
  <line x1="70" y1="40" x2="70" y2="60" stroke="#836EF9" stroke-width="1.5" filter="url(#glow)"/>
</svg>
