<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g stroke="#836EF9" fill="none" filter="url(#glow)">
    <!-- The minimalist, stylized lowercase 'a' (Scaled up & centered) -->
    <g stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Loop of the 'a' (radius 22, center 40,55, right edge 62) -->
      <path d="M 62,55 A 22,22 0 1,1 62,54.9" />
      <!-- Smooth stem and surreal curving tail -->
      <path d="M 62,18 L 62,75 A 22,22 0 0,0 87,58" />
    </g>
  </g>
</svg>
